onboarding = false

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

[ui]
# pane_borders = "off"
status_indicators = "dots"
sidebar_collapsed_mode = "hidden"
sidebar_start_collapsed = true
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "datetime", format = "%Y-%m-%d %H:%M" },
]

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+s"
reload_config = "prefix+r"

# tmux windows correspond to Herdr tabs; c, n, p, and 1..9 already match.
rename_tab = "prefix+comma"
detach = "prefix+d"

# tmux split-window -h creates side-by-side panes; -v stacks them.
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

resize_pane_left = "prefix+h"
resize_pane_down = "prefix+j"
resize_pane_up = "prefix+k"
resize_pane_right = "prefix+l"
zoom = "prefix+m"

# Keep resize mode available without conflicting with reload on prefix+r.
resize_mode = "prefix+shift+r"

# Navigate Vim splits first, then cross into neighbouring Herdr panes at an edge.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
command = 'exec "${SHELL:-sh}"'
description = "open floating shell"
width = "80%"
height = "80%"
