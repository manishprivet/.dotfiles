set -g @dotfiles_loaded 1
set -g prefix C-s

unbind r
bind r source-file ~/.tmux.conf
set-option -g status-position bottom

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

unbind %
bind-key | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g window-style 'fg=#d4be98,bg=terminal'
# set -g window-style 'fg=colour247,bg=colour236'
set -g window-active-style 'fg=#d4be98,bg=terminal'

set -sg escape-time 0

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
set -s set-clipboard external
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'sh -c "if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; else cat >/dev/null; fi"'

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

bind-key -n 'C-h' if-shell '~/.config/is_vim.sh' 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell '~/.config/is_vim.sh' 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell '~/.config/is_vim.sh' 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell '~/.config/is_vim.sh' 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # optional recommended
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# set -g @plugin "nordtheme/tmux"

# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark256'
# set -g @tmux-gruvbox-statusbar-alpha 'true'
# set -g @tmux-gruvbox-right-status-x ''
# set -g @tmux-gruvbox-right-status-y '%Y-%m-%d'
# set -g @tmux-gruvbox-right-status-z '#{USER}'

set -g @continuum-restore 'on'

if-shell 'test -x ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'

# Floating window binding
bind-key C-f display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "$SHELL"

# Houses palette; keep existing variable names for compatibility.
set -g @everforest_bg_dim '#1d2021'
set -g @everforest_bg0 '#282828'
set -g @everforest_bg1 '#32302f'
set -g @everforest_bg2 '#3c3836'
set -g @everforest_bg3 '#504945'
set -g @everforest_bg4 '#504945'
set -g @everforest_bg5 '#928374'
set -g @everforest_bg_visual '#3c3836'
set -g @everforest_bg_red '#3c2b2b'
set -g @everforest_bg_green '#30352b'
set -g @everforest_bg_blue '#3c3836'
set -g @everforest_bg_yellow '#3c3836'

set -g @everforest_fg '#d4be98'
set -g @everforest_red '#ea6962'
set -g @everforest_orange '#e78a4e'
set -g @everforest_yellow '#d8a657'
set -g @everforest_green '#a9b665'
set -g @everforest_aqua '#7daea3'
set -g @everforest_blue '#7daea3'
set -g @everforest_purple '#d3869b'
set -g @everforest_grey0 '#928374'
set -g @everforest_grey1 '#928374'
set -g @everforest_grey2 '#d4be98'
set -g @everforest_statusline1 '#a9b665'
set -g @everforest_statusline2 '#d4be98'
set -g @everforest_statusline3 '#ea6962'

set-option -g status "on"
set -g status-interval 2

set-option -g status-fg '#d4be98' # fg (No idea why I can't use variables here)
set-option -g status-bg '#282828' # bg0

set-option -g mode-style fg='#{@everforest_purple}',bg='#{@everforest_bg_red}' # fg=purple, bg=bg_visual

# default statusbar colors
set-option -g status-style fg='#{@everforest_fg}',bg='#{@everforest_bg_dim}',default # fg=fg bg=bg_dim

# ---- Windows ----
# default window title colors
set-window-option -g window-status-style fg='#{@everforest_bg5}',bg='#{@everforest_bg0}' # fg=yellow bg=bg0

# default window with an activity alert
set-window-option -g window-status-activity-style 'bg=#{@everforest_bg1},fg=#{@everforest_bg3}' # bg=bg1, fg=fg3

# active window title colors
set-window-option -g window-status-current-style fg='#{@everforest_fg}',bg='#{@everforest_bg_green}' # fg=fg bg=bg_green

# ---- Pane ----
# pane borders
set-option -g pane-border-style fg='#{@everforest_bg1}' # fg=bg1
set-option -g pane-active-border-style 'fg=#{@everforest_red}' # Houses coral

# pane number display
set-option -g display-panes-active-colour '#ea6962' # coral
set-option -g display-panes-colour '#7daea3' # seafoam

# ---- Command ----
# message info
set-option -g message-style fg='#{@everforest_statusline3}',bg='#{@everforest_bg_dim}' # fg=statusline3 bg=bg_dim

# writing commands inactive
set-option -g message-command-style 'fg=#{@everforest_bg3},bg=#{@everforest_bg1}' # bg=fg3, fg=bg1

# ---- Miscellaneous ----
# clock
set-window-option -g clock-mode-colour '#7daea3' # seafoam

# bell
set-window-option -g window-status-bell-style fg='#{@everforest_bg0}',bg='#{@everforest_statusline3}' # fg=bg, bg=statusline3

# ---- Formatting ----
set-option -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@everforest_bg_dim},bg=#{@everforest_red},bold] #S #[fg=#{@everforest_red},bg=#{@everforest_bg2},nobold]#[fg=#{@everforest_red},bg=#{@everforest_bg2},bold] #(whoami) #[fg=#{@everforest_bg2},bg=#{@everforest_bg0},nobold]'

set-option -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@everforest_bg2}]#[fg=#{@everforest_fg},bg=#{@everforest_bg2}] #[fg=#{@everforest_fg},bg=#{@everforest_bg2}]%Y-%m-%d  %H:%M #[fg=#{@everforest_aqua},bg=#{@everforest_bg2},bold]#[fg=#{@everforest_bg_dim},bg=#{@everforest_aqua},bold] #h '

set -g window-status-separator '#[fg=#{@everforest_grey2},bg=#{@everforest_bg0}] '
set -g window-status-format "#[fg=#{@everforest_grey0},bg=#{@everforest_bg0}] #I  #[fg=#{@everforest_grey0},bg=#{@everforest_bg0}]#W "
set -g window-status-current-format "#[fg=#{@everforest_bg0},bg=#{@everforest_bg_green}]#[fg=#{@everforest_fg},bg=#{@everforest_bg_green}] #I  #[fg=#{@everforest_fg},bg=#{@everforest_bg_green},bold]#W #[fg=#{@everforest_bg_green},bg=#{@everforest_bg0},nobold]"
